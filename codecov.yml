coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 80%

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: lua
      paths:
        - src/functions/glidemq.lua
      carryforward: true

comment:
  layout: 'reach, diff, flags, files'
  require_changes: false
